[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autowriter"
version = "0.2.0"
description = "Recreate a .docx inside a Google Doc, one editing operation at a time."
readme = "README.md"
requires-python = ">=3.8"
dependencies = []
authors = [{ name = "opsec-bot", email = "71150660+opsec-bot@users.noreply.github.com" }]
keywords = ["docx", "google-docs", "word", "document-conversion", "openxml"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Text Processing :: Markup :: XML",
]

[project.urls]
Homepage = "https://github.com/opsec-bot/autowriter"
Source = "https://github.com/opsec-bot/autowriter"
Issues = "https://github.com/opsec-bot/autowriter/issues"

[project.optional-dependencies]
# Only the `copy` command needs these; reading, planning and checking do not.
google = [
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
]
images = ["Pillow>=9.0"]
dev = ["pytest>=7.0", "pyflakes"]

[project.scripts]
autowriter = "autowriter.cli:main"

[tool.setuptools.packages.find]
include = ["autowriter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
